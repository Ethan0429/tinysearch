<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TinySearch</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img class="mark" src="icons/128.png" width="40" height="40" alt=""><div><h1>TinySearch</h1><p>Sourced answers, alongside chat.</p></div></header>
<main><label><span>TinySearch enabled</span><input id="enabled" type="checkbox" role="switch"></label>
<label><span>Show answers in chat</span><input id="inline" type="checkbox" role="switch"></label>
<label><span>Compact cards</span><input id="compact" type="checkbox" role="switch"></label>
<p id="status" role="status">Loading preferences…</p>
<a class="open" href="https://www.destiny.gg/bigscreen" target="_blank" rel="noopener noreferrer">Open DGG bigscreen ↗</a>
<p class="hint">Use the TinySearch bar in chat to search answers.</p></main>
<footer>TinySearch · Sourced answers for DGG chat.</footer><script src="popup.js"></script></body></html>
